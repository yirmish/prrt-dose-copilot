name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (pinned)
        run: pip install -r requirements-dev.txt
      - name: Every README number matches the committed CSVs
        run: python scripts/verify_claims.py
      - name: Offline tests (no token, synthetic data only)
        run: pytest -q
      - name: Smoke test, physical baseline back-end, with the live calibration check
        run: python scripts/smoke_test.py --backend baseline --cv
